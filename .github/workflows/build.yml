name: Build opsu iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # lets you trigger it manually from the Actions tab

jobs:
  build-ipa:
    runs-on: macos-14 # arm64, has Xcode preinstalled

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive # fluddokt's repo uses submodules

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          # RoboVM doesn't play nicely with Java 17+ due to reflection restrictions
          # stick to 11 to avoid a headache

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.robovm/cache # RoboVM caches AOT-compiled stuff here, HUGE timesave
          key: ${{ runner.os }}-gradle-robovm-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-robovm-

      - name: Create self-signed certificate for signing
        # RoboVM needs *something* in the keychain to sign with.
        # This produces an ad-hoc style cert — fine for TrollStore/sideloading,
        # NOT for App Store. The IPA will need to be re-signed locally anyway
        # if you're using Sideloadly/AltStore; TrollStore bypasses this entirely.
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          # Generate a self-signed cert
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /tmp/opsu-ios.key \
            -out /tmp/opsu-ios.crt \
            -subj "/CN=opsu-ios/O=opsu/C=US"

          # Convert to p12 and import into keychain
          openssl pkcs12 -export \
            -in /tmp/opsu-ios.crt \
            -inkey /tmp/opsu-ios.key \
            -out /tmp/opsu-ios.p12 \
            -passout pass:""

          security import /tmp/opsu-ios.p12 \
            -k build.keychain \
            -P "" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "" build.keychain

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build iOS IPA
        run: |
          ./gradlew :ios:createIPA \
            -Probovm.archs=arm64 \
            -Probovm.iOSSkipSigning=true
        # -Probovm.iOSSkipSigning=true produces an unsigned IPA which is actually
        # BETTER for TrollStore — TrollStore signs it itself on-device.
        # If you're using Sideloadly/AltStore, remove that flag and let the
        # self-signed cert above handle it (it'll just re-sign on install anyway).
        env:
          KEYCHAIN_PASSWORD: ""

      - name: Find built IPA
        id: find_ipa
        run: |
          IPA_PATH=$(find . -name "*.ipa" | head -n 1)
          echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT
          echo "Found IPA at: $IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: opsu-ios-${{ github.sha }}
          path: ${{ steps.find_ipa.outputs.ipa_path }}
          retention-days: 30
          if-no-files-found: error