name: Build opsu iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # lets you trigger it manually from the Actions tab

jobs:
  build-ipa:
    runs-on: macos-14 # arm64, has Xcode preinstalled

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive # fluddokt's repo uses submodules

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.robovm/cache
          # removed: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-robovm-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-robovm-

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Pre-cache RoboVM distribution (bypass HTTP Maven Central)
        run: |
          # Target the exact file that fails
          ROBOVM_CACHE="$HOME/.gradle/caches/modules-2/files-2.1/org.robovm/robovm-dist/1.0.0-beta-01"
          mkdir -p "$ROBOVM_CACHE"
          TARBALL="robovm-dist-1.0.0-beta-01-nocompiler.tar.gz"
          URL="https://repo1.maven.org/maven2/org/robovm/robovm-dist/1.0.0-beta-01/$TARBALL"
          echo "Downloading $TARBALL over HTTPS..."
          curl -fL --retry 3 -o "$ROBOVM_CACHE/$TARBALL" "$URL" || { echo "Download failed"; exit 1; }
          # Compute SHA1 and move into correct subdirectory
          SHA1=$(shasum -a 1 "$ROBOVM_CACHE/$TARBALL" | awk '{print $1}')
          mkdir -p "$ROBOVM_CACHE/$SHA1"
          mv "$ROBOVM_CACHE/$TARBALL" "$ROBOVM_CACHE/$SHA1/"
          echo "Cached $TARBALL with SHA1 $SHA1"
          # Also verify it's a valid gzip/tar
          tar tzf "$ROBOVM_CACHE/$SHA1/$TARBALL" > /dev/null && echo "Valid tarball" || { echo "Invalid tarball"; exit 1; }
      
      - name: Disable GWT plugin (not needed for iOS)
        run: |
          # Comment out the gwt-gradle-plugin line in build.gradle
          sed -i '' 's/^[[:space:]]*classpath "de.richsource.gradle.plugins:gwt-gradle-plugin:0.6"/\/\/ &/' build.gradle

      - name: Exclude HTML subproject and GWT plugin
        run: |
          # Remove 'html' from settings.gradle include line
          perl -pi -e "s/include.*?(['\"])html\1[,)]?//g" settings.gradle
          # Remove any orphaned commas/parentheses
          perl -pi -e "s/\([,)]?|[,)]+\)/()/g; s/,,/,/g; s/\(\s*,/(/g; s/,\s*\)/)/g" settings.gradle
          
          # Comment out apply plugin 'gwt'
          perl -pi -e "s/^(\s*apply plugin: ['\"]gwt['\"])/\/\/ \$1/" build.gradle

      - name: Pre-cache RoboVM distribution (backup if init script fails)
        run: |
          ROBOVM_CACHE="$HOME/.gradle/caches/modules-2/files-2.1/org.robovm/robovm-dist/1.0.0-beta-01"
          mkdir -p "$ROBOVM_CACHE"
          TARBALL="robovm-dist-1.0.0-beta-01-nocompiler.tar.gz"
          URL="https://repo1.maven.org/maven2/org/robovm/robovm-dist/1.0.0-beta-01/$TARBALL"
          curl -fL -o "$ROBOVM_CACHE/$TARBALL" "$URL" || exit 1
          SHA1=$(shasum -a 1 "$ROBOVM_CACHE/$TARBALL" | awk '{print $1}')
          mkdir -p "$ROBOVM_CACHE/$SHA1"
          mv "$ROBOVM_CACHE/$TARBALL" "$ROBOVM_CACHE/$SHA1/"
            
      - name: Build iOS IPA
        run: |
          ./gradlew :ios:createIPA \
            -Probovm.archs=arm64 \
            -Probovm.iOSSkipSigning=true \
            -Probovm.skipSigning=true \
            -PskipHtml=true
        # -Probovm.iOSSkipSigning=true produces an unsigned IPA which is actually
        # BETTER for TrollStore — TrollStore signs it itself on-device.
        # If you're using Sideloadly/AltStore, remove that flag and let the
        # self-signed cert above handle it (it'll just re-sign on install anyway).
        env:
          KEYCHAIN_PASSWORD: ""

      - name: Find built IPA
        id: find_ipa
        run: |
          IPA_PATH=$(find . -name "*.ipa" | head -n 1)
          echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT
          echo "Found IPA at: $IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: opsu-ios-${{ github.sha }}
          path: ${{ steps.find_ipa.outputs.ipa_path }}
          retention-days: 30
          if-no-files-found: error